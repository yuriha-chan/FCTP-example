name: fctp-authority
services:
  authority:
    build:
      context: ../..
      dockerfile: docker/authority/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_DESCRIBE: ${GIT_DESCRIBE:-}
        GIT_DIRTY: ${GIT_DIRTY:-false}
        BUILD_TIME: ${BUILD_TIME:-}
    image: fctp-authority:local
    init: true
    stop_grace_period: 30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:4100:8080"
    volumes:
      - authority-data:/data
      - ./config.json:/config/config.json:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/local/info').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  authority-data:
